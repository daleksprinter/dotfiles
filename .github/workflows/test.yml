name: dotfiles
run-name: dotfiles test
on: push
jobs:
  install:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: test
        run: make all
  gitleaks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: brew install gitleaks
      - run: gitleaks git --no-banner --redact --verbose
